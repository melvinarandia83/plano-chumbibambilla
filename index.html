.plc-root *, .plc-root *::before, .plc-root *::after { box-sizing: border-box; }

.plc-side { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; width: 100%; }
.plc-titulo { margin: 0; font-size: clamp(20px, 2.4vw + 8px, 34px); font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; }
